services:
  mysql:
    image: mysql:8.4


    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: optics
      MYSQL_USER: arnau
      MYSQL_PASSWORD: password

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./init/databases:/docker-entrypoint-initdb.d

volumes:
  mysql_data: